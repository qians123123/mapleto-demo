<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>重设密码 · Mapleto</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
        background: #f7f4ef;
        color: #2b2620;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 48px 20px 32px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fffdf9;
        border: 1px solid #ece5d8;
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 4px 24px rgba(80, 60, 30, 0.08);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.7; color: #5a5348; margin: 0 0 16px; }
      label { display: block; font-size: 14px; margin: 14px 0 6px; }
      input {
        width: 100%;
        font-size: 16px;
        padding: 12px 14px;
        border: 1px solid #d8cfbf;
        border-radius: 10px;
        outline: none;
      }
      input:focus { border-color: #c96f3f; }
      button {
        width: 100%;
        margin-top: 20px;
        padding: 13px;
        font-size: 16px;
        border: 0;
        border-radius: 10px;
        background: #c96f3f;
        color: #fff;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      .msg { font-size: 14px; line-height: 1.7; margin-top: 14px; }
      .msg.error { color: #a63a2a; }
      .msg.ok { color: #2e7d4f; }
      .foot { font-size: 13px; color: #8a8175; margin-top: 24px; }
      .hidden { display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="card">
      <h1 id="title">正在确认链接…</h1>
      <p id="desc">请稍候，正在确认这封邮件里的重设链接是否有效。</p>

      <form id="form" class="hidden">
        <label for="pw1">新密码</label>
        <input id="pw1" type="password" autocomplete="new-password" minlength="6" required placeholder="至少 6 位" />
        <label for="pw2">再输入一次新密码</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="6" required placeholder="与上面保持一致" />
        <button id="submit" type="submit">设置新密码</button>
        <p id="formMsg" class="msg"></p>
      </form>

      <p id="doneMsg" class="msg ok hidden"></p>
      <p id="errMsg" class="msg error hidden"></p>
      <p class="foot">Mapleto · 旅行小脚印</p>
    </div>

    <script>
      // 注意：这里只用可公开的 Supabase anon key（受 RLS 保护），
      // 绝不使用任何服务端密钥。
      var SUPABASE_URL = "https://arpdskfxfewambdpxkzl.supabase.co";
      var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFycGRza2Z4ZmV3YW1iZHB4a3psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjQ1ODgsImV4cCI6MjEwODgwMDU4OH0.kvZJJ-xLm1oJEWAZbqtT4tVf_TSRJFayFCVFlFmxoIo";

      var titleEl = document.getElementById("title");
      var descEl = document.getElementById("desc");
      var formEl = document.getElementById("form");
      var doneEl = document.getElementById("doneMsg");
      var errEl = document.getElementById("errMsg");
      var formMsgEl = document.getElementById("formMsg");
      var submitBtn = document.getElementById("submit");

      function showError(text) {
        titleEl.textContent = "链接无法使用";
        descEl.textContent = "请在 Mapleto App 里重新点“忘记密码”，再用新邮件里的链接打开本页。";
        errEl.textContent = text;
        errEl.classList.remove("hidden");
        formEl.classList.add("hidden");
      }

      function showConfirmed() {
        titleEl.textContent = "邮箱已确认";
        descEl.textContent = "邮箱已确认，请回到 Mapleto App 登录。";
      }

      function showForm() {
        titleEl.textContent = "设置新密码";
        descEl.textContent = "请输入新密码，设置完成后请回到 Mapleto App，用新密码登录。";
        formEl.classList.remove("hidden");
      }

      function friendlyError(e) {
        var m = (e && e.message) || "";
        if (/expired/i.test(m)) return "这个链接已经过期，请重新申请一封重置邮件。";
        if (/already/i.test(m) || /used/i.test(m)) return "这个链接已经被用过，请重新申请一封重置邮件。";
        return m ? "确认链接失败：" + m : "确认链接失败，请重新申请一封重置邮件。";
      }

      async function main() {
        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { detectSessionInUrl: false, persistSession: false, autoRefreshToken: false },
        });

        var hash = new URLSearchParams(window.location.hash.slice(1));
        var query = new URLSearchParams(window.location.search);
        var hashError = hash.get("error_description") || hash.get("error");
        var queryError = query.get("error_description") || query.get("error");
        if (hashError || queryError) {
          showError(decodeURIComponent(hashError || queryError));
          return;
        }

        var type = hash.get("type") || query.get("type") || "";
        var accessToken = hash.get("access_token");
        var refreshToken = hash.get("refresh_token") || "";
        var code = query.get("code");

        // 非重设类链接：只确认邮箱，不显示改密码表单。
        if (type && type !== "recovery") {
          showConfirmed();
          return;
        }

        try {
          if (accessToken) {
            var setRes = await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken,
            });
            if (setRes.error) throw setRes.error;
            showForm();
          } else if (code) {
            var exRes = await supabase.auth.exchangeCodeForSession(code);
            if (exRes.error) throw exRes.error;
            // PKCE 形式：换到 session 后才显示改密码表单；换不到就报错，绝不假装成功。
            showForm();
          } else {
            showError("这个链接里没有有效的重设凭证，可能已过期或已被用过。");
          }
        } catch (e) {
          showError(friendlyError(e));
        }

        formEl.addEventListener("submit", async function (ev) {
          ev.preventDefault();
          var pw1 = document.getElementById("pw1").value;
          var pw2 = document.getElementById("pw2").value;
          formMsgEl.textContent = "";
          formMsgEl.className = "msg";
          if (pw1.length < 6) {
            formMsgEl.textContent = "新密码至少需要 6 位。";
            formMsgEl.classList.add("error");
            return;
          }
          if (pw1 !== pw2) {
            formMsgEl.textContent = "两次输入的新密码不一致，请重新输入。";
            formMsgEl.classList.add("error");
            return;
          }
          submitBtn.disabled = true;
          submitBtn.textContent = "正在设置…";
          try {
            var upRes = await supabase.auth.updateUser({ password: pw1 });
            if (upRes.error) throw upRes.error;
            formEl.classList.add("hidden");
            titleEl.textContent = "密码已改好";
            descEl.textContent = "请回到 Mapleto App，用新密码登录。";
            doneEl.textContent = "新密码已设置成功。现在可以关闭本页，回到 Mapleto App 登录。";
            doneEl.classList.remove("hidden");
          } catch (e) {
            formMsgEl.textContent = friendlyError(e);
            formMsgEl.classList.add("error");
            submitBtn.disabled = false;
            submitBtn.textContent = "设置新密码";
          }
        });
      }

      main();
    </script>
  </body>
</html>
